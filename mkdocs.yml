site_name: jeba
site_description: Local-first, multilingual System One decision engine — ultra-fast, non-autoregressive, calibrated. Speaks the Jev /v1/systemone protocol.
site_url: https://munod.github.io/jeba/
repo_url: https://github.com/munod/jeba
repo_name: munod/jeba
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 The jeba Authors · Apache-2.0
docs_dir: docs

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - search.highlight
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/munod/jeba
      name: jeba on GitHub
    - icon: fontawesome/solid/robot
      link: https://huggingface.co/munod
      name: jeba models on Hugging Face

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - social:
      cards_layout_options:
        background_color: "#0b1020"
        color: "#e2e8f0"

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Overview: overview.md
  - Protocol: protocol.md
  - Architecture: architecture.md
  - Benchmarks: benchmarks.md
  - Roadmap: roadmap.md
  - Tasks: tasks.md
  - Testing: testing.md
  - Training: training.md
  - Release: release.md
  - Hugging Face: huggingface.md
  - Model card: model-card.md
  - Requirements:
      - Functional: requirements/functional.md
      - Non-functional: requirements/non-functional.md
      - Traceability: requirements/traceability.md
  - Decisions:
      - Index: adr/README.md
      - ADR-0001 Drop-in protocol: adr/ADR-0001-jev-drop-in-protocol.md
      - ADR-0002 Pluggable backend: adr/ADR-0002-pluggable-backend-phasing.md
      - ADR-0003 Python 3.12 + uv: adr/ADR-0003-python312-uv.md
      - ADR-0004 Local-first: adr/ADR-0004-local-first.md
      - ADR-0005 Encoder + RLCD: adr/ADR-0005-encoder-rlcd.md
      - ADR-0006 License & telemetry: adr/ADR-0006-license-telemetry.md
      - ADR-0007 Multilingual mmBERT: adr/ADR-0007-multilingual-mmbert.md
      - ADR-0008 LLM provider surface: adr/ADR-0008-llm-provider-surface.md
      - ADR-0009 Extension endpoints: adr/ADR-0009-extension-endpoints.md
      - ADR-0010 Weights distribution: adr/ADR-0010-weights-distribution.md
      - ADR-0011 No telemetry: adr/ADR-0011-no-telemetry.md
      - ADR-0012 ONNX before fast path: adr/ADR-0012-onnx-before-fast-path.md
