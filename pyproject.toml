[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jeba"
version = "0.0.1"
description = "Local-first, multilingual System One decision engine speaking the TypeSafe Jev /v1/systemone contract."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "The jeba Authors" }]
keywords = [
    "decision-engine",
    "system-one",
    "jev",
    "calibration",
    "multilingual",
    "local-first",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["pydantic>=2.6,<3"]

[project.optional-dependencies]
serve = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
]
onnx = [
    "onnx>=1.16",
    "onnxruntime>=1.17",
]
langchain = [
    "langchain-core>=0.2",
    "langgraph>=0.1",
]
mcp = ["mcp>=1.0"]
train = [
    "torch>=2.2",
    "transformers>=4.48",
    "safetensors>=0.4",
    "huggingface-hub>=0.20",
    "numpy>=1.26",
    "peft>=0.10",
    "accelerate>=0.30",
]
fast = ["tilelang>=0.1.14"]

[project.scripts]
jeba = "jeba.cli:main"
jeba-serve = "jeba.serve:main"
jeba-mcp-server = "jeba.mcp.server:main"

[project.urls]
Homepage = "https://github.com/munod/jeba"

[tool.hatch.build.targets.wheel]
packages = ["src/jeba"]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pyright>=1.1.380",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".opencode", "docs", ".specs", "docker"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["src/jeba", "tests"]
exclude = [".venv", "**/node_modules"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
markers = [
    "contract: Jev wire contract / golden-fixture tests (locked)",
    "e2e: end-to-end tests that bind a port (run serialized)",
    "slow: long-running tests (opt in)",
    "requires_serve: needs the 'serve' extra",
    "requires_onnx: needs the 'onnx' extra",
    "requires_train: needs the 'train' extra",
]
