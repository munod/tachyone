<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 120" width="450" height="120" role="img" aria-label="Tachyone — System 1 inference engine">
  <defs>
    <linearGradient id="tachyoneGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Plate so the wordmark reads on both light and dark backgrounds -->
  <rect x="0.75" y="0.75" width="448.5" height="118.5" rx="20" fill="#0B1020" stroke="#1E293B" stroke-width="1.5" />

  <!-- Logo mark (icon) -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="100" height="100" rx="24" fill="#0F172A" stroke="#1E293B" stroke-width="2" />
    <path d="M 60 28 L 42 28 L 32 58 L 48 58 L 36 78 L 68 44 L 52 44 Z" fill="url(#tachyoneGlow)" filter="url(#glow)" />
  </g>

  <!-- Wordmark -->
  <text x="130" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#F8FAFC" letter-spacing="2">
    TACHYONE<tspan fill="#38BDF8">.</tspan>
  </text>

  <!-- SYSTEM 1 badge + subtitle -->
  <g transform="translate(132, 78)">
    <rect x="0" y="0" width="76" height="18" rx="4" fill="#38BDF8" fill-opacity="0.15" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1" />
    <text x="38" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="9" fill="#38BDF8" text-anchor="middle" letter-spacing="1">
      SYSTEM 1
    </text>
    <text x="86" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" fill="#64748B" letter-spacing="2">
      INFERENCE ENGINE
    </text>
  </g>
</svg>
