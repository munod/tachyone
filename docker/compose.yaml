services:
  tachyone:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: tachyone:local
    ports:
      - "8000:8000"
    environment:
      # Offline, model-free default. Point TACHYONE_BACKEND at llm/encoder for real answers.
      TACHYONE_BACKEND: "fake"
      TACHYONE_HOST: "0.0.0.0"
      TACHYONE_PORT: "8000"
      # Set TACHYONE_API_KEY to require Bearer auth.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else sys.exit(1)"
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
